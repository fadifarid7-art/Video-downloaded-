<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Downloader</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--line:#dde2ea;--fg:#18202c;--muted:#5c6778;--accent:#2456d6}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}

p{color:var(--muted)}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;color:var(--fg);text-decoration:none}
a.card b{color:var(--accent)}
</style></head>
<body><div class="wrap">
  <h1>Video Downloader</h1>
  <p>Find the videos and images on a page and save them with your browser's own download manager.</p>
  <a class="card" href="test-folder/"><b>Test folder →</b><br>Nine generated test files with real download links and a ZIP.</a>
