<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Video Downloader</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--line:#dde2ea;--fg:#18202c;--muted:#5c6778;--accent:#2456d6;--accent-ink:#fff;--video:#7a3fd1;--image:#0f7f6c;--ok:#15803d;--warn:#b45309;--err:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#171e28;--line:#283242;--fg:#e6ebf2;--muted:#93a0b3;--accent:#6f95ff;--accent-ink:#0b1220;--video:#b48cff;--image:#4fd1b5;--ok:#4ade80;--warn:#fbbf24;--err:#fb923c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
form{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.inrow{display:flex;gap:8px}
input[type=url]{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:8px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--ok);color:#0b1220;border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
label.opt{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.status{margin:12px 2px;font-size:14px;color:var(--muted);min-height:1.3em}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.err{color:var(--err)}
.results[hidden]{display:none}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.rtitle{font-weight:600;flex:1 1 100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.th{width:56px;height:56px;border-radius:6px;background:var(--line);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:4px;color:#fff;font-weight:600}
.tag.videos{background:var(--video)}.tag.images{background:var(--image)}.tag.streams,.tag.other{background:var(--muted)}
.dl{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px;flex:none}
.dl.off{background:var(--line);color:var(--muted);pointer-events:none}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.help{margin-top:28px;font-size:13.5px;color:var(--muted)}
.help b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Video Downloader</h1>
  <p class="lead">Paste a link to a page, a file or a folder. You'll get a list of its videos and images with download buttons.</p>

  <form id="form">
    <div class="inrow">
      <input type="url" id="url" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="button" class="btn" id="paste">Paste</button>
    </div>
    <label class="opt"><input type="checkbox" id="all" checked> On folders, include every page</label>
    <button class="btn primary" id="scan" type="submit">Find videos and images</button>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="results" id="results" hidden>
    <div class="rhead">
      <div class="rtitle" id="rtitle"></div>
      <div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="tools" id="tools"></div>
    <div class="list" id="list"></div>
  </section>

  <p class="help"><b>Tip:</b> each Download opens your browser's own download menu, where you pick where to save. <b>Download all, one by one</b> starts the next file each time you tap it.</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = [], filter = "all", queuePos = 0;

  function status(t, k) { var s = $("status"); s.textContent = t || ""; s.className = "status" + (k ? " " + k : ""); }
  function fmt(b) { b = +b; if (!b) return ""; if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB"; return (b / 1073741824).toFixed(2) + " GB"; }
  function shown() { return items.filter(function (i) { return filter === "all" || i.type === filter; }); }
  function downloadable() { return shown().filter(function (i) { return i.dl; }); }

  try { var last = localStorage.getItem("vdl:last"); if (last) $("url").value = last; } catch (e) {}

  $("paste").addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { status("Your browser won't let the page read the clipboard. Long-press the box and choose Paste.", "warn"); return; }
    navigator.clipboard.readText().then(function (t) { $("url").value = (t || "").trim(); $("url").focus(); },
      function () { status("Clipboard access was blocked. Long-press the box and choose Paste.", "warn"); });
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("url").value.trim();
    if (!u) return;
    try { localStorage.setItem("vdl:last", u); } catch (er) {}
    $("scan").disabled = true;
    status("Reading the page…");
    $("results").hidden = true;
    fetch("/api/scan?url=" + encodeURIComponent(u) + ($("all").checked ? "&all=1" : ""), { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }, function () { return { ok: false, d: { error: "Unexpected answer (HTTP " + r.status + ")." } }; }); })
      .then(function (res) {
        if (!res.ok) { status(res.d.error || "Something went wrong.", "err"); return; }
        items = res.d.items || []; filter = "all"; queuePos = 0;
        $("rtitle").textContent = res.d.title || u;
        render();
        $("results").hidden = false;
        if (!items.length) status("No videos or images found on that page. Some sites load them only after you press play, which this can't see.", "warn");
        else status("Found " + summary() + ".", "ok");
      })
      .catch(function () { status("Couldn't reach the helper. Check your connection and try again.", "err"); })
      .then(function () { $("scan").disabled = false; });
  });

  function summary() {
    var c = {}; items.forEach(function (i) { c[i.type] = (c[i.type] || 0) + 1; });
    var p = [];
    if (c.videos) p.push(c.videos + " video" + (c.videos > 1 ? "s" : ""));
    if (c.images) p.push(c.images + " image" + (c.images > 1 ? "s" : ""));
    if (c.streams) p.push(c.streams + " stream" + (c.streams > 1 ? "s" : "") + " (not supported yet)");
    if (c.other) p.push(c.other + " other file" + (c.other > 1 ? "s" : ""));
    return p.join(", ");
  }

  function render() {
    var c = { all: items.length }; items.forEach(function (i) { c[i.type] = (c[i.type] || 0) + 1; });
    var chips = $("chips"); chips.textContent = "";
    [["all", "All"], ["videos", "Videos"], ["images", "Images"], ["streams", "Streams"], ["other", "Other"]].forEach(function (p) {
      if (p[0] !== "all" && !c[p[0]]) return;
      var b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", String(filter === p[0])); b.textContent = p[1] + " " + (c[p[0]] || 0);
      b.addEventListener("click", function () { filter = p[0]; queuePos = 0; render(); });
      chips.appendChild(b);
    });

    var tools = $("tools"); tools.textContent = "";
    var q = downloadable();
    if (q.length > 1) {
      if (queuePos >= q.length) queuePos = 0;
      var qb = document.createElement("button"); qb.type = "button";
      qb.className = "btn " + (queuePos ? "go" : "primary");
      qb.textContent = queuePos ? "Next: " + (queuePos + 1) + " of " + q.length : "Download all " + q.length + ", one by one";
      qb.addEventListener("click", function () {
        var it = downloadable()[queuePos];
        location.href = it.dl;
        status("Started " + it.name + " (" + (queuePos + 1) + " of " + q.length + "). Save it, then tap Next.", "ok");
        queuePos++;
        if (queuePos >= q.length) { queuePos = 0; status("Started all " + q.length + " downloads.", "ok"); }
        render();
      });
      tools.appendChild(qb);
      if (queuePos) {
        var rb = document.createElement("button"); rb.type = "button"; rb.className = "btn"; rb.textContent = "Restart";
        rb.addEventListener("click", function () { queuePos = 0; render(); });
        tools.appendChild(rb);
      }
    }
    if (shown().length) {
      var cb = document.createElement("button"); cb.type = "button"; cb.className = "btn"; cb.textContent = "Copy original links";
      cb.addEventListener("click", function () {
        var text = shown().map(function (i) { return i.source || ""; }).filter(Boolean).join("\n");
        var done = function () { cb.textContent = "Copied"; setTimeout(function () { cb.textContent = "Copy original links"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { status("Couldn't copy.", "warn"); });
      });
      tools.appendChild(cb);
    }

    var list = $("list"); list.textContent = "";
    var s = shown();
    if (!s.length) { var e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing in this filter."; list.appendChild(e); return; }
    s.forEach(function (i) {
      var row = document.createElement("div"); row.className = "row";
      var th = document.createElement("div"); th.className = "th";
      if (i.thumb) { var im = document.createElement("img"); im.src = i.thumb; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; im.onerror = function () { im.remove(); th.textContent = i.type === "videos" ? "VIDEO" : "FILE"; }; th.appendChild(im); }
      else th.textContent = i.type === "videos" ? "VIDEO" : i.type === "streams" ? "STREAM" : i.type === "images" ? "IMAGE" : "FILE";
      var meta = document.createElement("div"); meta.className = "meta";
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = i.name;
      var sub = document.createElement("div"); sub.className = "sub";
      var tag = document.createElement("span"); tag.className = "tag " + i.type;
      tag.textContent = i.type === "videos" ? "video" : i.type === "images" ? "image" : i.type === "streams" ? "stream" : "file";
      sub.appendChild(tag);
      if (i.size) { var sz = document.createElement("span"); sz.textContent = fmt(i.size); sub.appendChild(sz); }
      meta.appendChild(nm); meta.appendChild(sub);
      var a = document.createElement("a");
      if (i.dl) { a.className = "dl"; a.href = i.dl; a.textContent = "Download"; a.setAttribute("download", i.name); }
      else { a.className = "dl off"; a.textContent = "Stream"; a.title = "Streaming playlists aren't supported yet"; }
      row.appendChild(th); row.appendChild(meta); row.appendChild(a);
      list.appendChild(row);
    });
  }

  // Tell the person straight away if the helper is locked or not set up
  fetch("/api/whoami", { credentials: "same-origin" }).then(function (r) {
    if (r.status === 401) return r.json().then(function (d) { status(d.error || "Sign in to use the helper.", "warn"); });
  }).catch(function () {});
})();
</script>
</body>
</html>
