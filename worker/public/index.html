<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<title>Downloader</title>
<style>
/* Layout: one narrow column. Search card, then results with a single main action,
   then a compact file list. Progress lives in a slim strip pinned to the top. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --raised:#eef1f6; --line:#dfe4ec; --fg:#141a24; --muted:#5d687a;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#e6ecfd;
  --video:#7c4ddb; --image:#0f8a74; --ok:#13834a; --warn:#b45309; --err:#c2410c;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1218; --surface:#161c25; --raised:#1d2531; --line:#263142; --fg:#e8edf4; --muted:#93a0b4;
  --accent:#6f93ff; --accent-ink:#0b1220; --accent-soft:#1c2747;
  --video:#b38cff; --image:#45d0b0; --ok:#4ade80; --warn:#fbbf24; --err:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}

/* search */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.urlwrap{position:relative}
.clearx{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--raised);color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
#url{padding-right:44px!important}
#url{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font-size:16px;line-height:1.35}
#url::placeholder{color:var(--muted)}
.row2{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.grow{flex:1}
.btn:disabled{opacity:.5;cursor:default}
.recent{display:flex;flex-direction:column;gap:6px}
.rlabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;text-align:left;display:flex;gap:8px;align-items:baseline;min-width:0}
.ritem .rhost{font-weight:600;flex:none}
.ritem .rpath{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{margin:0;flex:1}
.newsearch{padding:9px 14px;font-size:15px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.curlink{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;margin-top:1px}
.curlink span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.again{border:0;background:none;color:var(--accent);font-size:16px;padding:0 4px;flex:none;line-height:1}
.searched{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px}
.sinfo{flex:1;min-width:0}
.slabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slink{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searched .btn{padding:10px 14px}
.searched .iconbtn{width:44px;padding:0;height:44px;font-size:18px}
.pw{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;font-size:16px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.status{margin:12px 2px 0;font-size:14px;color:var(--muted);min-height:1.2em}
.extcard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.extmsg{font-size:15px;line-height:1.45}
.status:empty{min-height:0;margin:0}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.err{color:var(--err)}

/* results */
.results{margin-top:20px}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rtext{flex:1;min-width:0}
.rtitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsum{font-size:13px;color:var(--muted);margin-top:1px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-size:14px;flex:none;max-width:48%}

/* main action */
.action{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.arow{display:flex;gap:8px;align-items:stretch}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--raised);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--muted);margin:0 2px}
.iconbtn{width:48px;flex:none;padding:0;font-size:20px;line-height:1}
.more{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.more label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.more select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px}
.linkbtn{border:0;background:none;padding:6px 0;text-align:left;font-size:15px;color:var(--accent);font-weight:600}

/* file list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.viewseg{display:flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;flex:none}
.viewseg button{border:0;background:transparent;border-radius:999px;width:34px;height:30px;font-size:15px;color:var(--muted);padding:0}
.viewseg button[aria-checked=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* grid view */
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.list.grid .item{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;position:relative}
.list.grid .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0}
.list.grid .thumb .glyph{font-size:34px}
.list.grid .thumb .playbadge{width:28px;height:28px;font-size:12px;left:8px;bottom:8px;right:auto}
.list.grid .info{padding:8px 10px 10px}
.list.grid .name{font-size:13.5px}
.list.grid .meta{font-size:12px}
.list.grid .dlbtn{position:absolute;top:8px;right:8px;width:38px;height:38px;font-size:18px;background:rgba(10,14,20,.6);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.list.grid .item.done .dlbtn{background:rgba(19,131,74,.85);color:#fff}
.list.grid .empty{grid-column:1/-1}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.thumb{position:relative;width:64px;height:64px;flex:none;border-radius:9px;overflow:hidden;background:var(--raised);display:grid;place-items:center;border:0;padding:0}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .glyph{color:var(--muted);font-size:22px}
.thumb .playbadge{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:10px;padding-left:2px}
.info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kind.videos{color:var(--video)}.kind.images{color:var(--image)}
.sent{color:var(--ok);font-weight:600}
.dlbtn{width:42px;height:42px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;text-decoration:none;font-size:20px;font-weight:700}
.dlbtn.off{background:var(--raised);color:var(--muted);font-size:11px;font-weight:600;pointer-events:none}
.item.done .dlbtn{background:var(--raised);color:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}

/* progress strip */
.strip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;width:min(680px,calc(100% - 24px));background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
.strip .srow{display:flex;align-items:center;gap:10px}
.strip .count{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.strip .note{flex:1;min-width:0;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip button{border:0;background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
.strip .track{height:4px;background:rgba(127,127,127,.35);border-radius:2px;overflow:hidden}
.strip .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.strip.done .count{color:var(--ok)}
.strip.fade{opacity:0}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.96);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));gap:12px}
.vmedia{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vmedia video,.vmedia img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block;background:#000}
.vmsg{color:#e8edf4}
.vmedia{position:relative}
.fsoffer{position:absolute;left:12px;right:12px;bottom:70px;background:rgba(22,28,37,.95);border:1px solid #263142;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;color:#e8edf4;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fsoffer p{margin:0;font-size:15px;line-height:1.45;text-align:center}
.fsoffer .vbar{justify-content:center}
.vproblem{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px;padding:20px}
.vproblem p{margin:0;font-size:15px;line-height:1.5}
.vproblem .vbar{justify-content:center}
.vmsg{color:#e8edf4;font-size:15px;text-align:center;padding:20px}
.vbar{display:flex;align-items:center;gap:8px;max-width:680px;width:100%;margin:0 auto}
.vname{flex:1;min-width:0;color:#e8edf4;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.vbtn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;background:#263142;color:#e8edf4;text-decoration:none;flex:none}
#vprev,#vnext{width:52px;text-align:center}
.vbtn.go{background:#6f93ff;color:#0b1220}
.vbtn:disabled{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="strip" id="strip" hidden role="status" aria-live="polite">
  <div class="srow"><span class="count" id="scount">0 / 0</span><span class="note" id="snote"></span><button type="button" id="sstop">Stop</button></div>
  <div class="track"><i id="sbar"></i></div>
</div>

<main class="wrap">
  <div class="top">
    <h1>Downloader</h1>
    <button type="button" class="btn newsearch" id="newlink" hidden>New search</button>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="urlwrap">
      <textarea id="url" rows="2" placeholder="Paste a link, or several (one per line)" autocapitalize="off" spellcheck="false" aria-label="Links" required></textarea>
      <button type="button" class="clearx" id="clearx" aria-label="Clear" hidden>×</button>
    </div>
    <div class="recent" id="recent" hidden><div class="rlabel">Recent</div><div class="rlist" id="rlist"></div></div>
    <div class="row2">
      <button type="button" class="btn" id="paste">Paste</button>
      <button type="submit" class="btn primary grow" id="scan">Find files</button>
    </div>
    <input type="password" id="pw" class="pw" placeholder="Link password" autocomplete="off" aria-label="Link password" hidden>
    <label class="opt"><input type="checkbox" id="all" checked> Include every page of a folder</label>
  </form>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="extcard" id="extcard" hidden>
    <div class="extmsg" id="extmsg"></div>
    <a class="btn primary" id="extopen" href="#" target="_blank" rel="noopener noreferrer">Open on site</a>
  </div>

  <section class="results" id="results" hidden>
    <div class="rhead">
      <div class="rtext">
        <div class="rtitle" id="rtitle"></div>
        <div class="curlink"><span id="curlink"></span><button type="button" class="again" id="again" aria-label="Search this link again" title="Search again">↻</button></div>
        <div class="rsum" id="rsum"></div>
      </div>
      <select class="sort" id="sort" aria-label="Sort">
        <option value="page">As on page</option>
        <option value="small">Smallest first</option>
        <option value="large">Largest first</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div class="bar">
      <div class="chips" id="chips" role="toolbar" aria-label="Filter"></div>
      <div class="viewseg" role="radiogroup" aria-label="Layout">
        <button type="button" role="radio" id="vList" aria-label="List view" title="List">☰</button>
        <button type="button" role="radio" id="vGrid" aria-label="Grid view" title="Grid">▦</button>
      </div>
    </div>

    <div class="action" id="action">
      <div class="arow">
        <button type="button" class="btn primary grow" id="dlall">Download all</button>
        <button type="button" class="btn iconbtn" id="morebtn" aria-expanded="false" aria-controls="more" aria-label="More options">⋯</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="How to download">
        <button type="button" role="radio" id="mManual" aria-checked="true">One at a time</button>
        <button type="button" role="radio" id="mAuto" aria-checked="false">Automatic</button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="more" id="more" hidden>
        <label>Automatic speed
          <select id="speed">
            <option value="wait">After each save</option>
            <option value="3000">One every 3 s</option>
            <option value="1000">One per second</option>
            <option value="300">All at once</option>
          </select>
        </label>
        <button type="button" class="linkbtn" id="shareAll" hidden>Save all to a folder (Safari)</button>
        <button type="button" class="linkbtn" id="zipAll">Download all as ZIP</button>
        <p class="hint" id="zipHint"></p>
        <button type="button" class="linkbtn" id="copyLinks">Copy original links</button>
        <button type="button" class="linkbtn" id="startOver" hidden>Start over</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>
  </section>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="vmedia" id="vmedia"></div>
  <div class="vbar">
    <button type="button" class="vbtn" id="vprev" aria-label="Previous">‹</button>
    <div class="vname" id="vname"></div>
    <button type="button" class="vbtn" id="vnext" aria-label="Next">›</button>
  </div>
  <div class="vbar">
    <button type="button" class="vbtn" id="vfull" aria-label="Full screen">⛶ Full screen</button>
    <a class="vbtn go" id="vdl" href="#" style="flex:1;text-align:center">Download</a>
    <button type="button" class="vbtn" id="vclose">Close</button>
  </div>
</div>

<script>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---------- state ----------
  var items = [], filter = "all", sortMode = store("vdl:sort") || "page";
  var layout = store("vdl:layout") === "grid" ? "grid" : "list";
  var mode = store("vdl:mode") === "auto" ? "auto" : "manual";
  var speed = store("vdl:speed") || "wait";
  var started = {};         // download link -> true once sent to the browser
  var manualNext = -1;      // index into the queue while stepping one at a time
  var viewList = [], viewPos = 0;

  // ---------- helpers ----------
  function status(t, k) { var s = $("status"); s.textContent = t || ""; s.className = "status" + (k ? " " + k : ""); }
  function fmt(b) { b = +b; if (!b) return ""; if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB"; return (b / 1073741824).toFixed(2) + " GB"; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function shown() {
    var list = items.filter(function (i) { return filter === "all" || i.type === filter; });
    if (sortMode === "small" || sortMode === "large") {
      var dir = sortMode === "small" ? 1 : -1;
      list = list.slice().sort(function (a, b) {
        var x = +a.size || 0, y = +b.size || 0;
        if (!x && !y) return a.order - b.order;
        if (!x) return 1; if (!y) return -1;
        return (x - y) * dir || a.order - b.order;
      });
    } else if (sortMode === "name") {
      list = list.slice().sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }); });
    }
    return list;
  }
  function queue() { return shown().filter(function (i) { return i.dl; }); }
  function remaining() { return queue().filter(function (i) { return !started[i.dl]; }); }
  function summary() {
    var c = {}; items.forEach(function (i) { c[i.type] = (c[i.type] || 0) + 1; });
    var p = [];
    if (c.videos) p.push(plural(c.videos, "video"));
    if (c.images) p.push(plural(c.images, "image"));
    if (c.streams) p.push(plural(c.streams, "stream") + " (not supported)");
    if (c.other) p.push(plural(c.other, "other file"));
    return p.join(" · ");
  }
  // Total size of a list, e.g. "3.4 MB" or "3.4 MB + 2 of unknown size"
  function totalText(list) {
    var sum = 0, unknown = 0;
    list.forEach(function (i) { if (+i.size > 0) sum += +i.size; else unknown++; });
    if (!sum) return unknown ? "" : "";
    return fmt(sum) + (unknown ? " + " + unknown + " of unknown size" : "");
  }
  function viewUrl(i) { return i.dl + (i.dl.indexOf("?") < 0 ? "?" : "&") + "view=1"; }
  function send(i) {
    started[i.dl] = true;
    var f = document.createElement("iframe"); f.style.display = "none"; f.src = i.dl; document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 120000);
  }

  // ---------- search ----------
  var lastRaw = "";
  function recentList() { try { return JSON.parse(store("vdl:recent") || "[]"); } catch (e) { return []; } }
  function addRecent(raw) {
    var r = recentList().filter(function (x) { return x !== raw; });
    r.unshift(raw); store("vdl:recent", JSON.stringify(r.slice(0, 6)));
  }
  function describe(raw) {
    var links = raw.match(/https?:\/\/[^\s<>"']+/g) || [];
    if (links.length > 1) return { host: plural(links.length, "link"), path: links.map(function (l) { try { return new URL(l).host; } catch (e) { return l; } }).filter(function (h, k, a) { return a.indexOf(h) === k; }).join(", ") };
    try { var u = new URL(links[0]); return { host: u.host.replace(/^www\./, ""), path: (u.pathname + u.search).replace(/^\/$/, "") }; }
    catch (e) { return { host: raw.slice(0, 40), path: "" }; }
  }
  function renderRecent() {
    var r = recentList(), box = $("rlist");
    box.textContent = "";
    $("recent").hidden = !r.length || !!$("url").value.trim();
    r.forEach(function (raw) {
      var d = describe(raw);
      var b = document.createElement("button"); b.type = "button"; b.className = "ritem";
      var h = document.createElement("span"); h.className = "rhost"; h.textContent = d.host;
      var pth = document.createElement("span"); pth.className = "rpath"; pth.textContent = d.path;
      b.appendChild(h); b.appendChild(pth);
      b.addEventListener("click", function () { $("url").value = raw; syncClear(); runSearch(); });
      box.appendChild(b);
    });
  }
  function runSearch() { if ($("form").requestSubmit) $("form").requestSubmit(); else $("form").dispatchEvent(new Event("submit", { cancelable: true })); }
  function collapse(raw) {
    var d = describe(raw);
    $("curlink").textContent = d.host + (d.path && d.host.indexOf(" link") < 0 ? d.path : "");
    $("form").hidden = true; $("newlink").hidden = false;
  }
  function expand(clear) {
    $("newlink").hidden = true; $("form").hidden = false;
    if (clear) { $("url").value = ""; $("pw").value = ""; $("pw").hidden = true; }
    syncClear();
    renderRecent(); $("url").focus();
  }
  $("newlink").addEventListener("click", function () { expand(true); status(""); });
  $("again").addEventListener("click", function () { $("url").value = lastRaw; syncClear(); runSearch(); });
  function syncClear() { $("clearx").hidden = !$("url").value; }
  $("url").addEventListener("input", function () { syncClear(); renderRecent(); });
  $("clearx").addEventListener("click", function () {
    $("url").value = ""; $("pw").value = ""; $("pw").hidden = true;
    syncClear(); renderRecent(); status(""); $("url").focus();
  });
  renderRecent();

  // Paste: into an empty box, a pasted link searches straight away.
  $("paste").addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { status("Long-press the box and choose Paste.", "warn"); return; }
    navigator.clipboard.readText().then(function (t) {
      t = (t || "").trim();
      if (!t) { status("Your clipboard is empty. Copy a link first.", "warn"); return; }
      $("url").value = t;            // replace what was there
      syncClear(); renderRecent();
      if (/https?:\/\//.test(t)) runSearch();
    }, function () { status("Long-press the box and choose Paste.", "warn"); });
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var raw = $("url").value.trim();
    var links = (raw.match(/https?:\/\/[^\s<>"']+/g) || []).filter(function (l, n, a) { return a.indexOf(l) === n; });
    if (!links.length) { status("Paste a full link, starting with https://", "err"); return; }
    lastRaw = raw; $("curlink").textContent = "";
    stopAuto(true); started = {}; manualNext = -1;
    $("scan").disabled = true; $("results").hidden = true;
    var found = [], failed = [], title = "", n = 0, vias = [], notices = [], externals = [];
    $("extcard").hidden = true;
    function next() {
      if (n >= links.length) return Promise.resolve();
      var u = links[n++];
      status(links.length > 1 ? "Reading link " + n + " of " + links.length + "…" : "Reading the page…");
      var pw = $("pw").value;
      return fetch("/api/scan?url=" + encodeURIComponent(u) + ($("all").checked ? "&all=1" : "") + (pw ? "&password=" + encodeURIComponent(pw) : ""), { credentials: "same-origin" })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }, function () { return { ok: false, d: { error: "Unexpected answer (HTTP " + r.status + ")." } }; }); })
        .then(function (res) {
          if (!res.ok) {
            if (res.d.code === "password") { $("pw").hidden = false; $("pw").focus(); }
            if (res.d.code === "external" && res.d.open) { externals.push(res.d); return; }
            failed.push(res.d.error || "error"); return;
          }
          if (!title) title = res.d.title || u;
          if (res.d.via) { try { vias.push(new URL(res.d.via).host); } catch (er) {} }
          if (res.d.notice) notices.push(res.d.notice);
          (res.d.items || []).forEach(function (it) { if (!found.some(function (f) { return f.source && f.source === it.source; })) found.push(it); });
        }, function () { failed.push("couldn't reach the helper"); })
        .then(next);
    }
    next().then(function () {
      items = found.map(function (it, k) { it.order = k; return it; }); filter = "all";
      $("rtitle").textContent = links.length > 1 ? plural(links.length, "link") : (title.replace(/\s*\|\s*[^|]+$/, "") || links[0]);
      var tot = totalText(items);
      $("rsum").textContent = summary() + (tot ? " · " + tot + " total" : "");
      render();
      $("results").hidden = false;
      if (items.length) { addRecent(raw); collapse(raw); }
      var tail = failed.length ? " Couldn't read " + plural(failed.length, "link") + ": " + failed.join("; ") : "";
      if (externals.length) {
        var x = externals[0];
        $("extmsg").textContent = x.error;
        $("extopen").href = x.open;
        $("extopen").textContent = "Open on " + (x.site || "the site");
        $("extcard").hidden = false;
      }
      if (!items.length && externals.length) { $("results").hidden = true; status(tail.trim(), failed.length ? "warn" : ""); }
      else if (!items.length) status((failed.length ? "Nothing found." : "No videos or images on that page. Some sites only load them after you press play.") + tail, failed.length ? "err" : "warn");
      else { var vmsg = vias.length ? "Followed " + (vias.length === 1 ? "the link" : plural(vias.length, "link")) + " to " + vias.filter(function (h, k, a) { return a.indexOf(h) === k; }).join(", ") + "." : ""; var nmsg = notices.length ? " " + notices.join(" ") : ""; status((vmsg + nmsg + tail).trim(), notices.length || failed.length ? "warn" : vias.length ? "ok" : ""); }
    }).then(function () { $("scan").disabled = false; });
  });

  // ---------- filters / sort ----------
  $("sort").value = sortMode;
  function setLayout(l) { layout = l; store("vdl:layout", l); render(); }
  $("vList").addEventListener("click", function () { setLayout("list"); });
  $("vGrid").addEventListener("click", function () { setLayout("grid"); });
  $("sort").addEventListener("change", function () { sortMode = $("sort").value; store("vdl:sort", sortMode); manualNext = -1; render(); });

  // ---------- mode switch + more ----------
  function setMode(m) { mode = m; store("vdl:mode", m); manualNext = -1; render(); }
  $("mManual").addEventListener("click", function () { setMode("manual"); });
  $("mAuto").addEventListener("click", function () { setMode("auto"); });
  $("speed").value = speed;
  $("speed").addEventListener("change", function () { speed = $("speed").value; store("vdl:speed", speed); render(); });
  $("morebtn").addEventListener("click", function () {
    var open = $("more").hidden; $("more").hidden = !open; $("morebtn").setAttribute("aria-expanded", String(open));
  });
  $("copyLinks").addEventListener("click", function () {
    var text = shown().map(function (i) { return i.source || ""; }).filter(Boolean).join("\n");
    if (!navigator.clipboard || !navigator.clipboard.writeText) { status("Copying isn't available here.", "warn"); return; }
    navigator.clipboard.writeText(text).then(function () { status("Copied " + plural(text.split("\n").length, "link") + ".", "ok"); }, function () { status("Couldn't copy.", "warn"); });
  });
  $("startOver").addEventListener("click", function () { started = {}; manualNext = -1; render(); status(""); });

  // ---------- render ----------
  function sizeTag(list) {
    var sum = 0, unknown = 0;
    list.forEach(function (i) { if (+i.size > 0) sum += +i.size; else unknown++; });
    return sum ? " · " + fmt(sum) + (unknown ? "+" : "") : "";
  }
  function render() {
    // chips
    var c = { all: items.length }; items.forEach(function (i) { c[i.type] = (c[i.type] || 0) + 1; });
    var chips = $("chips"); chips.textContent = "";
    [["all", "All"], ["videos", "Videos"], ["images", "Images"], ["streams", "Streams"], ["other", "Other"]].forEach(function (p) {
      if (p[0] !== "all" && !c[p[0]]) return;
      if (p[0] === "all" && Object.keys(c).length <= 2) return; // only one kind: no need for "All"
      var b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", String(filter === p[0] || (p[0] !== "all" && Object.keys(c).length <= 2)));
      b.textContent = p[1] + " " + c[p[0]];
      b.addEventListener("click", function () { filter = p[0]; manualNext = -1; render(); });
      chips.appendChild(b);
    });

    // main action
    var q = queue(), left = remaining();
    var running = !!autoTimer || autoActive;
    $("action").hidden = !q.length;
    $("mManual").setAttribute("aria-checked", String(mode === "manual"));
    $("mAuto").setAttribute("aria-checked", String(mode === "auto"));
    var btn = $("dlall");
    btn.disabled = running;
    if (running) btn.textContent = "Downloading…";
    else if (mode === "manual" && manualNext >= 0) btn.textContent = "Next: " + (q.length - left.length + 1) + " of " + q.length;
    else if (!left.length) btn.textContent = "Download all " + q.length + " again" + sizeTag(q);
    else if (left.length < q.length) btn.textContent = "Download the other " + left.length + sizeTag(left);
    else btn.textContent = (q.length === 1 ? "Download" : "Download all " + q.length) + sizeTag(q);
    $("startOver").hidden = left.length === q.length;
    var spd = $("speed").options[$("speed").selectedIndex].text.toLowerCase();
    var unk = left.filter(function (i) { return !(+i.size > 0); }).length;
    var unkNote = unk && unk < left.length ? " " + plural(unk, "file") + " don't list a size, so the total may be higher." : "";
    $("hint").textContent = (mode === "manual"
      ? "Tap once per file. Your browser asks where to save each one."
      : "Starts each file for you (" + spd + "). Save each one as your browser asks.") + unkNote;
    $("shareAll").hidden = !CAN_SHARE;
    $("zipAll").textContent = "Download all as ZIP" + sizeTag(q);
    $("zipAll").disabled = zipping || running;
    $("zipHint").textContent = CAN_STREAM_SAVE
      ? "Packs every file into one ZIP, saved straight to the folder you pick."
      : IOS ? "Works in Safari for smaller folders. Aloha can't save a ZIP made this way."
      : "Packs every file into one ZIP. This browser keeps it in memory until it's finished, so Chrome or Brave is better for very large folders.";

    // list
    var list = $("list"); list.textContent = "";
    list.className = "list" + (layout === "grid" ? " grid" : "");
    $("vList").setAttribute("aria-checked", String(layout === "list"));

    var no = document.createElement("button"); no.type = "button"; no.className = "vbtn"; no.textContent = "Close";
    no.addEventListener("click", function () { box.remove(); });
    var row = document.createElement("div"); row.className = "vbar"; row.appendChild(no); row.appendChild(go);
    box.appendChild(t); box.appendChild(row); m.appendChild(box);
  }
  // Same as the full-screen button in the video's own controls: ask for it right
  // away, on the tap itself (iPhones refuse it a moment later).
  function enterFull(v) {
    try {
      if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); return true; }   // iPhone video player
      var req = v.requestFullscreen || v.webkitRequestFullscreen;               // other browsers
      if (req) { var r = req.call(v); if (r && r.catch) r.catch(function () {}); return true; }
    } catch (e) { /* not ready yet */ }
    return false;
  }
  $("vfull").addEventListener("click", function () {
    var v = document.querySelector("#vmedia video");
    if (!v) return;
    if (store("vdl:fsmode2") === "tab") { openInBrowserPlayer(v); return; }
    var asked = v.readyState >= 1 && enterFull(v);
    if (!asked) {
      // Not prepared yet: start it (still on the tap) and go full screen as soon as it can.
      var p = v.play(); if (p && p.catch) p.catch(function () {});
      v.addEventListener("loadedmetadata", function () { enterFull(v); }, { once: true });
      if (v.readyState >= 1) enterFull(v);
    }
    setTimeout(function () {
      if (isNativeFull(v)) return;
      offerBrowserPlayer(v);
    }, 1200);
  });
  function closeViewer() { $("viewer").hidden = true; $("vmedia").textContent = ""; }
  $("vdl").addEventListener("click", function () { var i = viewList[viewPos]; if (i) { started[i.dl] = true; render(); } });
  $("vclose").addEventListener("click", closeViewer);
  $("vprev").addEventListener("click", function () { if (viewPos > 0) { viewPos--; showCurrent(); } });
  $("vnext").addEventListener("click", function () { if (viewPos < viewList.length - 1) { viewPos++; showCurrent(); } });
  document.addEventListener("keydown", function (e) {
    if ($("viewer").hidden) return;
    if (e.key === "Escape") closeViewer(); else if (e.key === "ArrowLeft") $("vprev").click(); else if (e.key === "ArrowRight") $("vnext").click();
  });

  // ---------- sign-in check ----------
  fetch("/api/whoami", { credentials: "same-origin" }).then(function (r) {
    if (r.status === 401) return r.json().then(function (d) { status(d.error || "Sign in to use the downloader.", "warn"); });
  }).catch(function () {});
})();
